name: CI

# Runs on every pull request. Lint (Prettier + ESLint), type/a11y check,
# build, and asset-size budget must pass before a PR can merge to main.
on:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, check and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint (Prettier + ESLint)
        run: npm run lint

      - name: Type & a11y check (svelte-check)
        run: npm run check

      - name: Build site
        run: npm run build

      - name: Asset size budget
        run: npm run check:assets
