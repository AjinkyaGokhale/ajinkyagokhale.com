name: Deploy to AWS S3 and CloudFront

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build site
      run: npm run build

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Deploy to S3 with proper MIME types and cache headers
      run: |
        # HTML files: no cache
        find ./dist -name "*.html" -type f | while read file; do
          aws s3 cp "$file" "s3://${{ secrets.S3_BUCKET_NAME }}/${file#./dist/}" \
            --content-type "text/html; charset=utf-8" \
            --cache-control "public, max-age=0, must-revalidate"
        done

        # CSS files: long cache
        find ./dist -name "*.css" -type f | while read file; do
          aws s3 cp "$file" "s3://${{ secrets.S3_BUCKET_NAME }}/${file#./dist/}" \
            --content-type "text/css" \
            --cache-control "public, max-age=31536000, immutable"
        done

        # JavaScript files: long cache
        find ./dist -name "*.js" -type f | while read file; do
          aws s3 cp "$file" "s3://${{ secrets.S3_BUCKET_NAME }}/${file#./dist/}" \
            --content-type "application/javascript" \
            --cache-control "public, max-age=31536000, immutable"
        done

        # JSON files: medium cache
        find ./dist -name "*.json" -type f | while read file; do
          aws s3 cp "$file" "s3://${{ secrets.S3_BUCKET_NAME }}/${file#./dist/}" \
            --content-type "application/json" \
            --cache-control "public, max-age=3600"
        done

        # PNG images: long cache
        find ./dist -name "*.png" -type f | while read file; do
          aws s3 cp "$file" "s3://${{ secrets.S3_BUCKET_NAME }}/${file#./dist/}" \
            --content-type "image/png" \
            --cache-control "public, max-age=31536000, immutable"
        done

        # SVG images: long cache
        find ./dist -name "*.svg" -type f | while read file; do
          aws s3 cp "$file" "s3://${{ secrets.S3_BUCKET_NAME }}/${file#./dist/}" \
            --content-type "image/svg+xml" \
            --cache-control "public, max-age=31536000, immutable"
        done

        # ICO files: long cache
        find ./dist -name "*.ico" -type f | while read file; do
          aws s3 cp "$file" "s3://${{ secrets.S3_BUCKET_NAME }}/${file#./dist/}" \
            --content-type "image/x-icon" \
            --cache-control "public, max-age=31536000, immutable"
        done

        # PDF files: no cache
        find ./dist -name "*.pdf" -type f | while read file; do
          aws s3 cp "$file" "s3://${{ secrets.S3_BUCKET_NAME }}/${file#./dist/}" \
            --content-type "application/pdf" \
            --cache-control "public, max-age=0, must-revalidate"
        done

        # XML files: medium cache
        find ./dist -name "*.xml" -type f | while read file; do
          aws s3 cp "$file" "s3://${{ secrets.S3_BUCKET_NAME }}/${file#./dist/}" \
            --content-type "application/xml" \
            --cache-control "public, max-age=3600"
        done

        # All other files
        aws s3 sync ./dist s3://${{ secrets.S3_BUCKET_NAME }} \
          --delete \
          --exclude "*.html" \
          --exclude "*.css" \
          --exclude "*.js" \
          --exclude "*.json" \
          --exclude "*.png" \
          --exclude "*.svg" \
          --exclude "*.ico" \
          --exclude "*.pdf" \
          --exclude "*.xml"

    - name: Ensure private S3 bucket configuration
      run: |
        echo "S3 bucket is private and served only through CloudFront"
        aws s3api get-public-access-block --bucket ${{ secrets.S3_BUCKET_NAME }}

    - name: Invalidate CloudFront cache
      run: |
        aws cloudfront create-invalidation \
          --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
          --paths "/*"

    - name: Deployment summary
      run: |
        echo "✅ Deployment completed successfully!"
        echo "🌐 Site URL: https://${{ secrets.CLOUDFRONT_DOMAIN }}"
        echo "📦 S3 Bucket: ${{ secrets.S3_BUCKET_NAME }}"
        echo "☁️  CloudFront Distribution: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}"
        echo "🔄 CloudFront cache invalidated"
