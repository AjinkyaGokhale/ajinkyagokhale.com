name: Deploy to AWS S3 and CloudFront

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to S3 and CloudFront
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Sync to S3 (only changed files, with cache headers)
        env:
          BUCKET: s3://${{ secrets.S3_BUCKET_NAME }}
        run: |
          # `aws s3 sync` uploads in parallel and skips files that are already in
          # the bucket — so unchanged assets aren't re-uploaded every deploy.
          # Each pass sets the right Cache-Control; content-type is auto-detected
          # from the extension unless set explicitly.

          # 1) Immutable, long-lived assets. Content-hashed filenames mean an
          #    unchanged file keeps its key, so --size-only safely skips it.
          aws s3 sync ./dist "$BUCKET" --size-only --no-progress \
            --exclude "*" \
            --include "*.css" --include "*.js" \
            --include "*.png" --include "*.jpg" --include "*.jpeg" \
            --include "*.webp" --include "*.gif" --include "*.svg" \
            --include "*.ico" --include "*.woff" --include "*.woff2" \
            --cache-control "public, max-age=31536000, immutable"

          # 2) AVIF — the CLI doesn't reliably guess its content-type.
          aws s3 sync ./dist "$BUCKET" --size-only --no-progress \
            --exclude "*" --include "*.avif" \
            --content-type "image/avif" \
            --cache-control "public, max-age=31536000, immutable"

          # 3) HTML — tiny and must stay fresh, so re-upload every deploy.
          aws s3 sync ./dist "$BUCKET" --no-progress \
            --exclude "*" --include "*.html" \
            --content-type "text/html; charset=utf-8" \
            --cache-control "public, max-age=0, must-revalidate"

          # 4) Feeds, manifest, robots — small; refresh each deploy, short cache.
          aws s3 sync ./dist "$BUCKET" --no-progress \
            --exclude "*" --include "*.json" --include "*.xml" --include "*.txt" \
            --cache-control "public, max-age=3600"

          # 5) PDF (résumé) — skip when unchanged.
          aws s3 sync ./dist "$BUCKET" --size-only --no-progress \
            --exclude "*" --include "*.pdf" \
            --content-type "application/pdf" \
            --cache-control "public, max-age=0, must-revalidate"

          # 6) Delete files from the bucket that no longer exist in the build.
          aws s3 sync ./dist "$BUCKET" --size-only --no-progress --delete

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"

      - name: Deployment summary
        run: |
          echo "Deployment completed successfully!"
          echo "Site URL: https://${{ secrets.CLOUDFRONT_DOMAIN }}"
          echo "S3 Bucket: ${{ secrets.S3_BUCKET_NAME }}"
          echo "CloudFront Distribution: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}"
          echo "CloudFront cache invalidated"
